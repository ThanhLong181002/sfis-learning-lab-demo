*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}

.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#0d1627;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#36d6bd);color:#071426;font-weight:900;font-size:18px}.brand strong{display:block;font-size:16px}.brand small{color:var(--muted)}.navlabel{color:#6f83a1;text-transform:uppercase;font-size:10px;letter-spacing:1.5px;padding:0 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;border-color:transparent;text-align:left;color:#aebbd0;padding:11px 12px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#192940;color:white;border-color:#263b59}.nav .ico{width:20px;text-align:center}.sidebar-foot{margin-top:auto;border:1px solid var(--line);background:#111b2e;border-radius:12px;padding:13px;color:var(--muted);font-size:12px}
main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(11,17,32,.8)}.crumb{color:var(--muted);font-size:13px}.localtag{border:1px solid #255447;background:#102c2b;color:var(--teal);border-radius:20px;padding:6px 10px;font-size:12px}.content{max-width:1300px;margin:auto;padding:30px}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.pagehead h1{font-size:30px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.6px}.pagehead p{margin:0;color:var(--muted);max-width:680px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;min-width:0}.statlabel{color:var(--muted);font-size:12px}.statvalue{font-size:28px;font-weight:800;margin:7px 0}.statfoot{font-size:12px;color:var(--teal)}.two{grid-template-columns:1.25fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card h3{margin:0 0 7px;font-size:16px}.sub{color:var(--muted);font-size:13px}.module{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}.module:last-child{border-bottom:0;padding-bottom:0}.module-icon{width:42px;height:42px;flex:none;border-radius:12px;background:#1b3150;display:grid;place-items:center;font-size:20px}.module h3{margin:0 0 4px}.module p{margin:0 0 10px;color:var(--muted);font-size:13px}.pill{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 8px;color:#b9c8dc;margin-right:5px}.progress{height:7px;border-radius:20px;background:#25354c;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.lessonlayout{display:grid;grid-template-columns:245px 1fr;gap:16px}.lessonlist{display:grid;gap:6px;align-content:start}.lessonlist button{text-align:left;background:transparent}.lessonlist button.active{border-color:var(--blue);background:#182d49}.lessonbody h2{margin-top:0}.lessonbody h3{margin-top:24px}.lessonbody p,.lessonbody li{color:#c1cee0}.callout{padding:13px 15px;border-left:3px solid var(--teal);background:#102a30;border-radius:0 9px 9px 0;margin:15px 0}.code{background:#080e19;border:1px solid var(--line);border-radius:10px;padding:15px;overflow:auto;color:#b8e2ff;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}.quizopt{display:block;width:100%;text-align:left;margin:8px 0;background:#111b2e}.quizopt.correct{border-color:var(--green);background:#12332b}.quizopt.wrong{border-color:var(--red);background:#3a2029}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#17243a;color:var(--muted)}.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea{background:#080f1c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.field textarea{min-height:150px;resize:vertical;font-family:ui-monospace,monospace}.case{border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0;background:#0d1728}.case h4{margin:0 0 6px}.case p{color:var(--muted);font-size:13px;margin:0 0 10px}.case.selected{border-color:var(--blue)}.status{font-size:11px;border-radius:20px;padding:4px 8px;display:inline-block;background:#3a2f19;color:var(--yellow)}.status.done{background:#12352b;color:var(--green)}.resulttable{width:100%;border-collapse:collapse;font-size:13px}.resulttable th,.resulttable td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.resulttable th{color:var(--muted);font-weight:600}.resulttable td{font-family:ui-monospace,monospace}.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}.toast{position:fixed;right:20px;bottom:20px;background:#15342f;border:1px solid #286657;border-radius:10px;padding:12px 16px;display:none;z-index:10}.small{font-size:12px;color:var(--muted)}.mobilemenu{display:none}.ai-output{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;background:#080e19;border:1px solid var(--line);border-radius:10px;padding:15px;min-height:120px;color:#dce8f8}.ai-output:empty:before{content:"Phản hồi từ Claude sẽ hiển thị tại đây...";color:var(--muted)}.warning{padding:13px 15px;border:1px solid #765b28;background:#332914;color:#ffe0a3;border-radius:10px;margin:12px 0}.keyrow{display:flex;gap:8px}.keyrow input{flex:1;min-width:0}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:20;inset:0 auto 0 0;width:260px;box-shadow:20px 0 50px #0008}.mobilemenu{display:inline-block}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.two,.three,.labgrid,.lessonlayout{grid-template-columns:1fr}.topbar{padding:0 18px}.pagehead h1{font-size:25px}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.statvalue{font-size:23px}.content{padding:14px}.pagehead{display:block}.pagehead .btnrow{margin-top:12px}}

<script>
const lessons = [
 {id:'overview',title:'SFIS là gì?',level:'Cơ bản',mins:8,desc:'Vai trò của hệ thống trong dây chuyền sản xuất điện tử.',body:`
 <h2>SFIS là gì?</h2><p><b>SFIS (Shop Floor Information System)</b> là hệ thống thông tin tại xưởng sản xuất, hỗ trợ kiểm soát quy trình, ghi nhận kết quả công đoạn và truy xuất lịch sử sản phẩm. Tùy nhà máy, tên gọi, chức năng và quy tắc triển khai có thể khác nhau.</p>
 <div class="callout"><b>Tư duy của kỹ sư vận hành:</b> SFIS không chỉ là một website. Nó kết nối thông tin sản phẩm, lệnh sản xuất, công đoạn, thiết bị và dữ liệu kiểm tra để hỗ trợ thực thi quy trình.</div>
 <h3>Các đối tượng thường gặp</h3><ul><li><b>SN / Serial Number:</b> mã định danh của sản phẩm hoặc cụm linh kiện.</li><li><b>Work Order (WO):</b> lệnh sản xuất và thông tin kế hoạch liên quan.</li><li><b>Routing:</b> thứ tự công đoạn mà sản phẩm cần đi qua.</li><li><b>Station:</b> trạm/công đoạn thực hiện một thao tác hoặc bài kiểm tra.</li><li><b>Test Result:</b> kết quả như PASS, FAIL hoặc trạng thái khác theo quy định.</li><li><b>Traceability:</b> khả năng truy xuất lịch sử sản phẩm, công đoạn và dữ liệu liên quan.</li></ul>
 <h3>Ví dụ luồng dữ liệu</h3><div class="code">Quét SN → Kiểm tra WO / trạng thái SN\n        → Kiểm tra routing và station\n        → Thực hiện công đoạn / nhận kết quả test\n        → Ghi nhận dữ liệu và thời gian\n        → Cho phép qua công đoạn tiếp theo hoặc chặn lỗi</div>
 <h3>Vai trò IT vận hành</h3><p>Thu thập triệu chứng, xác định phạm vi ảnh hưởng, kiểm tra kết nối/API/log/database theo quyền được cấp, tái hiện lỗi trên môi trường an toàn, phối hợp bộ phận liên quan và xác nhận kết quả sau xử lý.</p>`},
 {id:'flow',title:'Production Flow & Routing',level:'Cơ bản',mins:10,desc:'Hiểu routing, station, WIP và quy tắc chuyển công đoạn.',body:`
 <h2>Production Flow & Routing</h2><p>Routing mô tả thứ tự công đoạn được cấu hình cho sản phẩm hoặc dòng sản xuất. Một sản phẩm chỉ được chuyển tiếp khi thỏa các quy tắc được hệ thống áp dụng.</p>
 <h3>Ví dụ routing minh họa</h3><div class="code">ST10: Assembly → ST20: Function Test → ST30: Final Inspection</div>
 <ul><li><b>WIP:</b> sản phẩm đang nằm trong quá trình sản xuất.</li><li><b>Out-of-sequence:</b> sản phẩm đến sai công đoạn hoặc thiếu bước trước đó.</li><li><b>Rework:</b> quy trình sửa chữa/kiểm tra lại theo luồng được phê duyệt.</li><li><b>Hold:</b> trạng thái tạm giữ để ngăn tiếp tục quy trình.</li></ul>
 <div class="callout">Khi SN bị chặn, đừng vội kết luận “SFIS lỗi”. Hãy xác minh SN, WO, routing, station, trạng thái hold/rework và thời điểm phát sinh.</div>
 <h3>Câu hỏi chẩn đoán nhanh</h3><p>Nếu chỉ một nhóm SN bị chặn ở ST20 nhưng các SN khác vẫn chạy bình thường, hãy so sánh routing, kết quả ST10, trạng thái SN và WO của hai nhóm trước khi nghi ngờ lỗi hệ thống.</p>`},
 {id:'database',title:'Dữ liệu & Traceability',level:'Trung cấp',mins:12,desc:'Cách suy nghĩ về dữ liệu sản xuất và lịch sử serial.',body:`
 <h2>Dữ liệu & Traceability</h2><p>Traceability cho phép lần theo lịch sử của một SN qua các công đoạn và mốc thời gian. Thiết kế bảng thực tế phụ thuộc hệ thống; ví dụ dưới đây chỉ là schema học tập.</p>
 <div class="code">Production_Records(\n  RecordID, SerialNumber, WorkOrder,\n  StationID, TestTime, Result, ErrorCode\n)</div>
 <h3>Những câu hỏi dữ liệu thường gặp</h3><ul><li>SN này đã đi qua những station nào?</li><li>Ở station nào tỷ lệ FAIL tăng cao?</li><li>Mã lỗi nào xuất hiện nhiều nhất trong ca?</li><li>SN nào có nhiều lần test bất thường?</li><li>Lỗi bắt đầu từ thời điểm nào và ảnh hưởng bao nhiêu sản phẩm?</li></ul>
 <h3>Nguyên tắc khi điều tra dữ liệu</h3><ul><li>Giới hạn truy vấn bằng khoảng thời gian và điều kiện phù hợp.</li><li>Kiểm tra múi giờ, định dạng timestamp và định nghĩa PASS/FAIL.</li><li>Phân biệt một SN có nhiều bản ghi với số lượng SN duy nhất.</li><li>Dùng truy vấn chỉ đọc trên môi trường được phép; không tự ý UPDATE/DELETE dữ liệu sản xuất.</li></ul>`},
 {id:'api',title:'API, Logs & Connectivity',level:'Trung cấp',mins:12,desc:'Phân biệt lỗi client, API, mạng và database.',body:`
 <h2>API, Logs & Connectivity</h2><p>Khi client SFIS không hoạt động, hãy chia hệ thống thành từng lớp để khoanh vùng thay vì kiểm tra ngẫu nhiên.</p>
 <div class="code">Operator / Scanner → Client App → Network → API Service → Database / Downstream</div>
 <h3>Nhóm dấu hiệu phổ biến</h3><ul><li><b>Timeout:</b> phản hồi vượt quá thời gian chờ; có thể do mạng, tải dịch vụ hoặc dependency chậm.</li><li><b>401 / 403:</b> thường liên quan xác thực hoặc quyền truy cập.</li><li><b>400:</b> request/format/field không hợp lệ theo API contract.</li><li><b>404:</b> endpoint hoặc tài nguyên không tồn tại theo đường dẫn được gọi.</li><li><b>5xx:</b> lỗi phía server hoặc dependency; cần đối chiếu server log và request ID.</li></ul>
 <h3>Quy trình điều tra</h3><ol><li>Ghi lại thời gian, station, SN mẫu và thông báo nguyên văn.</li><li>Xác định lỗi xảy ra với một máy, một station hay toàn nhà máy.</li><li>Kiểm tra kết nối và trạng thái dịch vụ theo quyền được cấp.</li><li>Đối chiếu client log, API log, request/correlation ID và database metrics.</li><li>Thực hiện biện pháp khắc phục đã được phê duyệt, rồi xác nhận bằng test case.</li></ol>
 <div class="callout">Không đưa password, token, thông tin cá nhân hoặc dữ liệu sản xuất nhạy cảm vào log chia sẻ hay dịch vụ AI công cộng.</div>`}
,
 {id:'serial',title:'Serial Number (SN) & vòng đời sản phẩm',level:'Cơ bản',mins:9,desc:'Định danh SN, trạng thái và cách kiểm tra một SN bị từ chối.',body:`
 <h2>Serial Number (SN) & vòng đời sản phẩm</h2>
 <p>SN là mã định danh được dùng để liên kết sản phẩm với lệnh sản xuất, công đoạn và lịch sử kiểm tra. Quy tắc tạo SN và phạm vi duy nhất phụ thuộc thiết kế hệ thống của từng nhà máy.</p>
 <h3>Các câu hỏi cần xác minh khi scan lỗi</h3><ol><li>SN có đúng định dạng và được đọc đầy đủ từ scanner không?</li><li>SN đã được tạo/đăng ký trong hệ thống chưa?</li><li>SN đang ở trạng thái hợp lệ, hold, scrapped hay đã hoàn tất?</li><li>SN có thuộc đúng WO/model/line không?</li><li>SN đã có bản ghi ở công đoạn trước chưa?</li></ol>
 <div class="callout"><b>Thực hành tốt:</b> so sánh một SN lỗi với một SN chạy bình thường. Chỉ thay đổi một biến tại mỗi lần so sánh và lưu lại thời điểm, station, thông báo nguyên văn.</div>
 <h3>Ví dụ</h3><div class="code">SN: SN10002\nStation: ST20\nThông báo: Previous operation not completed\nKiểm tra tiếp: lịch sử ST10 → routing → trạng thái SN</div>
 <p>Không tự tạo, sửa hoặc xóa SN trong môi trường sản xuất nếu không có quyền và quy trình phê duyệt.</p>`},
 {id:'workorder',title:'Work Order (WO) & Model',level:'Cơ bản',mins:8,desc:'Liên hệ giữa WO, model, line và điều kiện sản xuất.',body:`
 <h2>Work Order (WO) & Model</h2><p>WO đại diện cho một lệnh sản xuất hoặc phạm vi kế hoạch. Tùy hệ thống, WO có thể liên kết model, số lượng, line, thời gian hiệu lực và trạng thái phát hành.</p>
 <h3>Checklist khi SN không thuộc lệnh sản xuất</h3><ul><li>WO có đúng mã và đang ở trạng thái được phép sản xuất?</li><li>SN có được gán cho WO đó hay không?</li><li>Model của sản phẩm có khớp model/recipe được cấu hình tại station?</li><li>WO có đúng line, ca hoặc khoảng thời gian hiệu lực?</li><li>Có thay đổi kế hoạch hoặc đồng bộ dữ liệu gần thời điểm phát sinh?</li></ul>
 <div class="callout">Không kết luận WO sai chỉ từ một thông báo. Thu thập SN mẫu, WO, model, station và timestamp; sau đó đối chiếu với nguồn dữ liệu được phân quyền.</div>
 <h3>Ví dụ quan hệ</h3><div class="code">WorkOrder WO2601 → Model M-A → SN10001, SN10002\nWO2602 → Model M-B → SN10003, SN10004</div>
 <p>Tên trường và trạng thái cụ thể trong hệ thống thực tế có thể khác ví dụ học tập này.</p>`},
 {id:'station',title:'Station, Line & thiết bị',level:'Cơ bản',mins:9,desc:'Phân biệt station, line, terminal, tester và cấu hình trạm.',body:`
 <h2>Station, Line & thiết bị</h2><p>Station thường biểu diễn một bước nghiệp vụ hoặc điểm kiểm tra. Một station có thể có nhiều terminal/thiết bị, nhưng cách ánh xạ phụ thuộc kiến trúc triển khai.</p>
 <h3>Phân loại phạm vi lỗi</h3><ul><li><b>Một terminal:</b> kiểm tra client, scanner, cấu hình cục bộ và kết nối.</li><li><b>Một station:</b> so sánh các terminal cùng station, cấu hình và thiết bị dùng chung.</li><li><b>Nhiều station:</b> ưu tiên xem xét dịch vụ chung, network, dependency hoặc thay đổi hệ thống.</li><li><b>Một model/WO:</b> xem xét dữ liệu, recipe, routing hoặc thay đổi sản xuất liên quan.</li></ul>
 <h3>Ma trận so sánh nhanh</h3><div class="code">Terminal A / ST20: lỗi\nTerminal B / ST20: bình thường → so sánh terminal/cấu hình\nST20 và ST30 cùng lỗi → kiểm tra thành phần dùng chung\nChỉ model M-A lỗi → kiểm tra model/recipe/WO liên quan</div>
 <div class="callout">Đây là các giả thuyết ưu tiên kiểm tra, không phải kết luận chắc chắn. Hãy dùng bằng chứng và timeline để xác nhận.</div>`},
 {id:'hold-rework',title:'Hold, Rework & trạng thái WIP',level:'Trung cấp',mins:11,desc:'Hiểu sản phẩm bị giữ, luồng sửa chữa và điều kiện mở lại.',body:`
 <h2>Hold, Rework & trạng thái WIP</h2><p>WIP là sản phẩm đang nằm trong quá trình sản xuất. Hold thường ngăn sản phẩm tiếp tục cho đến khi được xử lý; rework là luồng sửa chữa/kiểm tra lại được quy định. Tên trạng thái và thao tác cụ thể phụ thuộc hệ thống.</p>
 <h3>Điều tra SN bị Hold</h3><ol><li>Đọc trạng thái và lý do hold hiển thị.</li><li>Kiểm tra lịch sử: ai/luồng nào đặt hold, thời gian và mã lý do nếu có.</li><li>Xác minh quyết định xử lý với nhóm có thẩm quyền (Production/Quality/PE).</li><li>Kiểm tra quy trình phê duyệt và điều kiện giải phóng hold.</li><li>Sau khi được xử lý chính thức, xác minh trạng thái và routing trên hệ thống.</li></ol>
 <h3>Rework cần được kiểm soát</h3><ul><li>Phải có routing/luồng rework được phê duyệt.</li><li>Cần giữ liên kết lịch sử lỗi ban đầu và kết quả sau sửa chữa.</li><li>Không bỏ qua công đoạn hoặc tự sửa trạng thái để “cho chạy tiếp”.</li></ul>
 <div class="callout">Với sản phẩm bị hold vì chất lượng, không tự giải phóng trạng thái. Chuyển đúng nhóm có thẩm quyền và lưu bằng chứng xử lý.</div>`},
 {id:'traceability',title:'Traceability end-to-end',level:'Trung cấp',mins:12,desc:'Lần theo hành trình SN qua các công đoạn và timestamp.',body:`
 <h2>Traceability end-to-end</h2><p>Traceability giúp trả lời sản phẩm đã đi qua đâu, khi nào, nhận kết quả gì và dữ liệu nào liên quan. Bản ghi có thể được ghi trực tiếp hoặc qua dịch vụ/queue tùy kiến trúc.</p>
 <h3>Chuỗi bằng chứng tham khảo</h3><div class="code">SN → WO / Model → Routing → Station event\n   → Test result / ErrorCode → Timestamp / Operator / Equipment\n   → Downstream status / Traceability view</div>
 <h3>Khi lịch sử thiếu một công đoạn</h3><ul><li>Xác minh đúng SN và bộ lọc thời gian.</li><li>Kiểm tra công đoạn có thực sự chạy và tester có gửi kết quả không.</li><li>Đối chiếu response của API với log server theo request/correlation ID.</li><li>Kiểm tra queue/retry/sync nếu kiến trúc sử dụng các thành phần đó.</li><li>Phân biệt chưa ghi dữ liệu, ghi chậm và giao diện chưa cập nhật.</li></ul>
 <div class="callout">Một dòng không xuất hiện trên giao diện chưa đủ chứng minh dữ liệu đã mất. Theo dấu dữ liệu từ nguồn phát sinh đến nơi lưu và nơi hiển thị.</div>`},
 {id:'data-quality',title:'Data Quality & định nghĩa KPI',level:'Trung cấp',mins:12,desc:'Tránh nhầm số bản ghi với số SN và tính fail rate đúng phạm vi.',body:`
 <h2>Data Quality & định nghĩa KPI</h2><p>Trước khi viết SQL, cần thống nhất câu hỏi nghiệp vụ và mẫu số. Một SN có thể tạo nhiều bản ghi test; số bản ghi không đồng nghĩa số sản phẩm duy nhất.</p>
 <h3>Fail rate theo bản ghi</h3><div class="code">Fail Rate (%) = số bản ghi Result = 'FAIL'\n                / tổng bản ghi trong cùng phạm vi × 100</div>
 <h3>Những điểm cần chốt</h3><ul><li>Khoảng thời gian: dùng mốc bắt đầu bao gồm và mốc kết thúc không bao gồm khi phù hợp.</li><li>Phạm vi: station, line, model, WO, ca hoặc loại test.</li><li>Đơn vị đếm: bản ghi test hay SN duy nhất.</li><li>Định nghĩa PASS/FAIL: có trạng thái retest, abort hoặc pending không?</li><li>Timezone: timestamp được lưu theo giờ local hay UTC?</li></ul>
 <h3>Ví dụ SQL học tập</h3><div class="code">SELECT StationID,\n       COUNT(*) AS TotalCount,\n       SUM(CASE WHEN Result = 'FAIL' THEN 1 ELSE 0 END) AS FailCount,\n       100.0 * SUM(CASE WHEN Result = 'FAIL' THEN 1 ELSE 0 END)\n         / NULLIF(COUNT(*), 0) AS FailRate\nFROM Production_Records\nWHERE TestTime >= '2026-11-03'\n  AND TestTime <  '2026-11-04'\nGROUP BY StationID;</div>
 <p>Truy vấn chỉ minh họa schema học tập. Trong hệ thống thật, hãy xác nhận tên bảng, kiểu dữ liệu, quyền truy cập và định nghĩa KPI đã thống nhất.</p>`},
 {id:'incident-method',title:'Phương pháp xử lý incident',level:'Nâng cao',mins:13,desc:'Từ ghi nhận triệu chứng đến khoanh vùng, escalation và xác nhận.',body:`
 <h2>Phương pháp xử lý incident</h2><p>Mục tiêu ban đầu là khôi phục hoạt động an toàn và xác định phạm vi, không phải đoán nguyên nhân ngay từ thông báo đầu tiên.</p>
 <h3>Quy trình 7 bước</h3><ol><li><b>Record:</b> ghi thời gian, station, SN mẫu, thông báo nguyên văn và người báo.</li><li><b>Scope:</b> xác định một SN, một terminal, một station, nhiều station hay toàn line.</li><li><b>Compare:</b> so sánh trường hợp lỗi với trường hợp bình thường.</li><li><b>Collect evidence:</b> log, request ID, status code, timestamp, metrics và thay đổi gần đây.</li><li><b>Isolate:</b> xác định lớp nghi vấn: dữ liệu nghiệp vụ, client, network, API, database hay downstream.</li><li><b>Escalate / recover:</b> theo quy trình nội bộ; chỉ áp dụng thao tác đã được phê duyệt.</li><li><b>Verify & document:</b> chạy kiểm tra an toàn, xác nhận không tái phát và ghi lại kết quả.</li></ol>
 <h3>Mẫu incident note</h3><div class="code">Issue: [triệu chứng và thông báo]\nStart time: [YYYY-MM-DD HH:mm:ss + timezone]\nScope: [station / line / model / số lượng ảnh hưởng]\nEvidence: [log ID, status code, query read-only]\nActions: [đã kiểm tra / đã được phê duyệt]\nNext step / Owner: [việc tiếp theo và nhóm phụ trách]</div>
 <div class="callout">Không ghi mật khẩu, token, dữ liệu cá nhân hoặc thông tin sản xuất nhạy cảm vào báo cáo không được phép chia sẻ.</div>`},
 {id:'change-release',title:'Change, Release & xác nhận sau xử lý',level:'Nâng cao',mins:10,desc:'Liên hệ sự cố với thay đổi gần đây và kiểm tra sau khắc phục.',body:`
 <h2>Change, Release & xác nhận sau xử lý</h2><p>Nếu lỗi bắt đầu ngay sau một bản release hoặc thay đổi cấu hình, đây là mối tương quan đáng kiểm tra nhưng chưa phải bằng chứng duy nhất của nguyên nhân.</p>
 <h3>Những dữ kiện cần đối chiếu</h3><ul><li>Thời điểm bắt đầu lỗi so với release/configuration change.</li><li>Phiên bản client, API, cấu hình station và phạm vi triển khai.</li><li>Nhóm station/model/WO bị ảnh hưởng và nhóm không bị ảnh hưởng.</li><li>Error rate, latency, log và thay đổi ở dependency.</li><li>Change ticket, người phê duyệt, kế hoạch rollback và tiêu chí thành công.</li></ul>
 <h3>Checklist xác nhận sau xử lý</h3><ol><li>Chạy test case được phê duyệt trên môi trường phù hợp.</li><li>Xác nhận kết quả ghi nhận và traceability cập nhật đúng.</li><li>Kiểm tra các station liên quan và theo dõi chỉ số trong khoảng thời gian thống nhất.</li><li>Ghi rõ thời gian khôi phục, bằng chứng và các rủi ro còn lại.</li><li>Đóng incident theo quy trình, không chỉ dựa vào việc “màn hình đã hết lỗi”.</li></ol>
 <div class="callout">Không tự ý restart, rollback hoặc sửa cấu hình production. Tuân thủ change management và escalation của nhà máy.</div>`}

];

function initSqlEngine(){
 if(sqlDB)return Promise.resolve(sqlDB); if(sqlEnginePromise)return sqlEnginePromise;
 sqlEnginePromise=new Promise((resolve,reject)=>{
  const boot=()=>{if(!window.initSqlJs){reject(new Error('Không tải được thư viện SQLite. Hãy kiểm tra kết nối Internet rồi tải lại trang.'));return}
   window.initSqlJs({locateFile:file=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+file}).then(SQL=>{
    sqlDB=new SQL.Database();
    sqlDB.run('CREATE TABLE Production_Records (SerialNumber TEXT, WorkOrder TEXT, StationID TEXT, TestTime TEXT, Result TEXT, ErrorCode TEXT)');

function sqlEscape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderSqlResults(rows){

async function runSql(){
 const input=document.getElementById('sqlInput');if(!input)return;const q=input.value.trim().replace(/;+\s*$/,'');
 if(!q)return showSqlError('Hãy nhập một câu truy vấn SQL.');
 if(!/^(SELECT|WITH)\b/i.test(q)||/\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH|PRAGMA|VACUUM|REINDEX|BEGIN|COMMIT|ROLLBACK|SAVEPOINT|RELEASE|GRANT|REVOKE)\b/i.test(q))return showSqlError('Chỉ cho phép truy vấn đọc bắt đầu bằng SELECT hoặc WITH. Các lệnh thay đổi dữ liệu bị chặn.');
 if(q.includes(';'))return showSqlError('Mỗi lần chỉ chạy một câu SQL.');
 try{const db=await initSqlEngine();const results=db.exec(q);let rows=[];if(results.length){const r=results[0];rows=r.values.map(vals=>Object.fromEntries(r.columns.map((c,i)=>[c,vals[i]])))}
 let status=document.getElementById('sqlStatus');if(status)status.textContent=`Thành công · ${rows.length} dòng kết quả`;renderSqlResults(rows);
 }catch(e){showSqlError(e.message||'Lỗi SQL. Kiểm tra cú pháp, tên bảng và tên cột.')}
}

function prodEsc(v){return String(v).replace(/'/g,"''")}
async function loadProductionData(){
 const root=document.getElementById('prodTable');if(!root)return;
 try{
  const db=await initSqlEngine();
  const station=productionFilters.station,wo=productionFilters.workorder,model=productionFilters.model,metric=productionFilters.metric;
  const where=[];
  if(station!=='ALL')where.push(`p.StationID='${prodEsc(station)}'`);
  if(wo!=='ALL')where.push(`p.WorkOrder='${prodEsc(wo)}'`);
  if(model!=='ALL')where.push(`w.Model='${prodEsc(model)}'`);
  const clause=where.length?'WHERE '+where.join(' AND '):'';
  const base=`FROM Production_Records p LEFT JOIN Work_Orders w ON p.WorkOrder=w.WorkOrder ${clause}`;
  const k=db.exec(`SELECT COUNT(*) total,SUM(CASE WHEN p.Result='PASS' THEN 1 ELSE 0 END) pass,SUM(CASE WHEN p.Result='FAIL' THEN 1 ELSE 0 END) fail ${base}`);
  const vals=k[0]?.values[0]||[0,0,0],total=Number(vals[0]||0),pass=Number(vals[1]||0),fail=Number(vals[2]||0),rate=total?fail*100/total:0;
  document.getElementById('prodKpis').innerHTML=[
   ['Tổng lượt test',total.toLocaleString('vi-VN'),'Trong phạm vi lọc'],
   ['PASS',pass.toLocaleString('vi-VN'),'Kết quả đạt'],
   ['FAIL',fail.toLocaleString('vi-VN'),'Kết quả lỗi'],
   ['Fail rate',rate.toFixed(2)+'%','FAIL / tổng lượt test']
  ].map(x=>`<div class="card"><div class="statlabel">${x[0]}</div><div class="statvalue">${x[1]}</div><div class="statfoot">${x[2]}</div></div>`).join('');
  const col=metric==='model'?'w.Model':metric==='workorder'?'p.WorkOrder':'p.StationID';
  const q=db.exec(`SELECT ${col} label,COUNT(*) total,SUM(CASE WHEN p.Result='FAIL' THEN 1 ELSE 0 END) fail,SUM(CASE WHEN p.Result='PASS' THEN 1 ELSE 0 END) pass,ROUND(100.0*SUM(CASE WHEN p.Result='FAIL' THEN 1 ELSE 0 END)/COUNT(*),2) failRate ${base} GROUP BY ${col} ORDER BY failRate DESC`);
  const rows=(q[0]?.values||[]).map(r=>({label:r[0],total:r[1],fail:r[2],pass:r[3],rate:Number(r[4]||0)}));
  document.getElementById('prodBars').innerHTML=rows.length?rows.map(r=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${sqlEscape(r.label)}</b><span>${r.rate.toFixed(2)}% · ${r.fail}/${r.total}</span></div><div style="height:10px;background:var(--panel2);border-radius:9px;overflow:hidden"><div style="height:100%;width:${Math.min(100,r.rate)}%;background:var(--red);border-radius:9px"></div></div></div>`).join(''):'Không có dữ liệu phù hợp.';
  const passPct=total?pass/total*100:0,failPct=total?fail/total*100:0;
  document.getElementById('prodDonut').innerHTML=`<div style="height:18px;border-radius:12px;overflow:hidden;background:var(--panel2);display:flex;margin:18px 0"><div style="width:${passPct}%;background:var(--green)"></div><div style="width:${failPct}%;background:var(--red)"></div></div><div style="font-size:28px;font-weight:750">${total?100:0}%</div><div class="small">Tổng cơ cấu kết quả</div>`;
  document.getElementById('prodLegend').innerHTML=`<p>🟢 PASS: ${pass} (${passPct.toFixed(1)}%)</p><p>🔴 FAIL: ${fail} (${failPct.toFixed(1)}%)</p>`;
  window.productionExportRows=rows;
  document.getElementById('prodTable').innerHTML=rows.length?`<div style="overflow:auto"><table class="resulttable"><thead><tr><th>${metric==='model'?'Model':metric==='workorder'?'Work Order':'Station'}</th><th>Total</th><th>PASS</th><th>FAIL</th><th>Fail rate</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${sqlEscape(r.label)}</td><td>${r.total}</td><td>${r.pass}</td><td>${r.fail}</td><td>${r.rate.toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>`:'Không có dữ liệu phù hợp.';
 }catch(e){root.innerHTML=`<div class="callout" style="border-color:var(--red)">Không thể tải dữ liệu SQLite: ${sqlEscape(e.message||e)}</div>`}
}

 <div class="card" style="margin-top:16px"><h3>6. Network fundamentals – ghi nhớ nhanh</h3><div class="grid three"><div class="case"><b>DNS</b><p>Phân giải hostname thành IP. Lỗi DNS có thể khiến app không tìm được server dù mạng vật lý vẫn hoạt động.</p></div><div class="case"><b>TCP</b><p>Thiết lập kết nối giữa source/destination IP và port. Timeout khác với connection refused.</p></div><div class="case"><b>TLS</b><p>Mã hóa và xác thực server bằng certificate. Không nên bỏ qua kiểm tra chứng chỉ.</p></div><div class="case"><b>HTTP</b><p>Giao thức request/response; method, URL, headers, body và status code.</p></div><div class="case"><b>Latency</b><p>Thời gian phản hồi. Cần phân biệt DNS lookup, TCP connect, TLS handshake và server processing.</p></div><div class="case"><b>Correlation ID</b><p>Mã liên kết request giữa gateway và các service để tra log xuyên hệ thống.</p></div></div></div>
 <div class="callout">Nguyên tắc incident: xác định scope → ghi timestamp và evidence → phân lớp DNS/TCP/TLS/HTTP/application → kiểm chứng giả thuyết → escalation hoặc khắc phục theo change process. Tất cả endpoint và dữ liệu trong module này là giả lập.</div>`}
function runMockApi(){const method=document.getElementById('apiMethod').value,endpoint=document.getElementById('apiEndpoint').value,body=document.getElementById('apiBody').value,req=document.getElementById('apiRequestPreview'),out=document.getElementById('apiResponse');let parsed=null;if(['POST','PUT','PATCH'].includes(method)){try{parsed=JSON.parse(body)}catch(e){out.textContent='400 Bad Request — JSON không hợp lệ: '+e.message;req.textContent=method+' '+endpoint+'\nContent-Type: application/json\n\n'+body;return}}req.textContent=method+' '+endpoint+'\nHost: sfis.mock.local\nAccept: application/json'+(['POST','PUT','PATCH'].includes(method)?'\nContent-Type: application/json\n\n'+JSON.stringify(parsed,null,2):'');let status=200,data={status:'OK',message:'Mock API is healthy',timestamp:'2026-11-03T08:00:00+07:00'};if(endpoint.includes('UNKNOWN')){status=404;data={error:'NOT_FOUND',message:'Serial number does not exist in mock dataset'}}else if(endpoint.includes('serial/')){data={serialNumber:'SN10001',workOrder:'WO2601',model:'MODEL-A',currentStation:'ST10',lastResult:'PASS',traceability:'MOCK'}}else if(endpoint.includes('workorders')){data={workOrder:'WO2601',model:'MODEL-A',status:'RELEASED',plannedQty:1200,completedQty:438}}else if(endpoint.includes('production/results')){if(!parsed){status=400;data={error:'BAD_REQUEST',message:'POST/PUT/PATCH cần JSON body hợp lệ'}}else{status=201;data={message:'Mock result accepted',recordId:'MOCK-REC-001',received:parsed}}}if(method==='DELETE'){status=405;data={error:'METHOD_NOT_ALLOWED',message:'Delete disabled in this learning simulator'}}out.textContent='HTTP/1.1 '+status+' '+({200:'OK',201:'Created',400:'Bad Request',404:'Not Found',405:'Method Not Allowed'}[status]||'Response')+'\nContent-Type: application/json\n\n'+JSON.stringify(data,null,2)+'\n\n[MOCK RESPONSE — không có request nào được gửi ra mạng]'}
function validateLabJson(){let input=document.getElementById('jsonInput'),box=document.getElementById('jsonFeedback');try{let value=JSON.parse(input.value);input.value=JSON.stringify(value,null,2);box.innerHTML='<b style="color:var(--green)">✓ JSON hợp lệ</b><p>Root type: '+(Array.isArray(value)?'Array':value===null?'null':typeof value)+'</p><p>Đã format thành công.</p>'}catch(e){box.innerHTML='<b style="color:var(--red)">✕ JSON không hợp lệ</b><p>'+sqlEscape(e.message)+'</p><p class="small">Kiểm tra dấu phẩy cuối, dấu ngoặc kép, key phải có dấu ngoặc kép và kiểu dữ liệu.</p>'}}

function renderDbaTopic(){let el=document.getElementById('dbaTopicDetail');if(!el)return;let data={health:['Kiểm tra trạng thái database',`SELECT name, state_desc, recovery_model_desc
FROM sys.databases;

SELECT @@VERSION AS SQLServerVersion;`,'Kiểm tra database ONLINE/OFFLINE, recovery model và phiên bản SQL Server. Kết hợp SQL Server Error Log và monitoring để xác định tình trạng thực tế.'],backup:['Lịch sử backup',`SELECT database_name, type, backup_start_date,
       backup_finish_date, is_copy_only
FROM msdb.dbo.backupset
ORDER BY backup_finish_date DESC;`,'type: D = Full, I = Differential, L = Transaction Log. Xác minh backup file, chain và restore test; không chỉ dựa vào job status.'],index:['Index usage (tham khảo)',`SELECT OBJECT_NAME(s.object_id) AS table_name,
       i.name, s.user_seeks, s.user_scans,
       s.user_updates
FROM sys.dm_db_index_usage_stats s
JOIN sys.indexes i ON i.object_id=s.object_id
 AND i.index_id=s.index_id
WHERE s.database_id=DB_ID();`,'DMV counters có thể reset sau restart và không tự động chứng minh index thừa. Cần xem workload, execution plan và thời gian quan sát.'],blocking:['Session và request đang chờ',`SELECT session_id, blocking_session_id,
       wait_type, wait_time, status
FROM sys.dm_exec_requests
WHERE blocking_session_id <> 0;`,'Tìm blocking chain, transaction age, wait type và câu SQL. Cẩn trọng khi kết thúc session vì rollback có thể kéo dài và ảnh hưởng nghiệp vụ.'],space:['Dung lượng database',`EXEC sys.sp_spaceused;

SELECT name, type_desc, size*8/1024 AS size_mb
FROM sys.database_files;`,'Theo dõi data file, log file, autogrowth, free space và tốc độ tăng trưởng. Không shrink định kỳ như một biện pháp tối ưu mặc định.'],integrity:['Kiểm tra tính toàn vẹn',`DBCC CHECKDB (N'SFIS_DB')
WITH NO_INFOMSGS;`,'DBCC CHECKDB là thao tác quan trọng nhưng có thể tiêu thụ tài nguyên. Lên lịch và đánh giá trên môi trường phù hợp; ưu tiên restore test từ backup tốt.']}[document.getElementById('dbaTopic').value];el.innerHTML=`<b>${data[0]}</b><pre class="code">${data[1]}</pre><p>${data[2]}</p>`}

function buildRecoveryPlan(){let goal=document.getElementById('recoveryGoal').value,txt=goal==='point'?'1. Restore Full backup WITH NORECOVERY.\n2. Restore Differential backup phù hợp (nếu có).\n3. Restore liên tiếp các Transaction Log backup theo đúng chain.\n4. Áp dụng STOPAT tới thời điểm mục tiêu nếu log chain cho phép.\n5. RESTORE ... WITH RECOVERY, kiểm tra dữ liệu và ứng dụng.':goal==='latest'?'1. Xác định Full backup mới nhất đã xác minh.\n2. Tìm Differential và Log backup liên quan theo chain.\n3. Restore theo đúng thứ tự vào môi trường đích.\n4. Chạy integrity/validation và kiểm tra nghiệp vụ SFIS.':'1. Kích hoạt kế hoạch DR và xác nhận quyền điều phối.\n2. Xác định RPO/RTO, site đích, DNS/network và dependency.\n3. Restore database từ backup đã kiểm chứng; replay log nếu thiết kế hỗ trợ.\n4. Kiểm tra ứng dụng, kết nối, quyền và consistency.\n5. Chuyển traffic theo runbook, theo dõi và ghi nhận thời gian phục hồi.';document.getElementById('recoveryOutput').textContent='RECOVERY PLAN — MOCK\n'+txt+'\n\nLưu ý: cần xác minh backup chain, encryption key/certificate, version compatibility và restore rehearsal. Đây không phải lệnh thực thi.'}
function renderIndexDetail(){let el=document.getElementById('indexDetail');if(!el)return;let d={sn:['SerialNumber lookup','CREATE INDEX IX_Production_Records_SerialNumber_TestTime\nON dbo.Production_Records (SerialNumber, TestTime DESC)\nINCLUDE (StationID, Result, ErrorCode);','Index key bắt đầu bằng SerialNumber phù hợp với predicate equality; TestTime hỗ trợ sort/range. INCLUDE có thể giảm key lookup nhưng làm index lớn hơn.'],time:['Time-range query','CREATE INDEX IX_Production_Records_TestTime\nON dbo.Production_Records (TestTime)\nINCLUDE (SerialNumber, StationID, Result);','Index theo TestTime có thể hỗ trợ lọc khoảng thời gian. Chọn kiểu dữ liệu datetime phù hợp và dùng range predicate thay vì chuyển đổi cột trong WHERE.'],result:['Station / Result aggregation','CREATE INDEX IX_Production_Records_Station_Result\nON dbo.Production_Records (StationID, Result);','Có thể hỗ trợ filter/group theo StationID và Result. Aggregation vẫn phải đọc dữ liệu phù hợp; đo actual execution plan và logical reads.']}[document.getElementById('indexQuery').value];el.innerHTML=`<b>${d[0]}</b><pre class="code">${d[1]}</pre><p>${d[2]}</p>`}
function renderIsolationDetail(){let el=document.getElementById('isolationDetail');if(!el)return;let d={readuncommitted:['READ UNCOMMITTED','Có thể đọc dữ liệu chưa commit (dirty read). Không phù hợp khi số liệu production cần chính xác.'],readcommitted:['READ COMMITTED','Ngăn dirty read; mức mặc định phổ biến của SQL Server. Non-repeatable read vẫn có thể xảy ra.'],repeatable:['REPEATABLE READ','Giữ shared lock trên dữ liệu đã đọc tới hết transaction; giảm concurrency và vẫn có thể gặp phantom read.'],serializable:['SERIALIZABLE','Mức cô lập cao; khóa phạm vi để ngăn phantom, nhưng có thể tăng blocking/deadlock.'],snapshot:['SNAPSHOT','Đọc phiên bản dữ liệu nhất quán qua row versioning nếu database được cấu hình; cần theo dõi version store.']}[document.getElementById('isolationLevel').value];el.innerHTML=`<b>${d[0]}</b><p>${d[1]}</p>`}
function renderDbaScenario(){let el=document.getElementById('dbaScenarioDetail');if(!el)return;let x=dbaScenarios[document.getElementById('dbaScenario').value];el.innerHTML=`<div class="feedback"><b>Triệu chứng</b><p>${x.symptom}</p><b>Evidence</b><p>${x.evidence}</p><b>Checklist điều tra</b>${x.checks.map((c,i)=>`<label style="display:flex;gap:8px;margin:9px 0"><input type="checkbox"><span>${i+1}. ${c}</span></label>`).join('')}<details style="margin-top:10px"><summary><b>Gợi ý nguyên nhân / hướng xử lý</b></summary><p>${x.cause}</p></details></div>`}

function quizPage(){let q=quiz[quizIndex];return `${head('KNOWLEDGE CHECK','Kiểm tra kiến thức','5 câu hỏi về SFIS, SQL, API và quy trình troubleshooting.')}<div class="card" style="max-width:820px;margin:auto"><div style="display:flex;justify-content:space-between"><span class="pill">Câu ${quizIndex+1} / ${quiz.length}</span><span class="small">${Object.keys(quizAnswers).length} câu đã trả lời</span></div><div class="progress"><span style="width:${(quizIndex+1)/quiz.length*100}%"></span></div><h2 style="margin-top:22px">${q.q}</h2>${q.opts.map((o,i)=>`<button class="quizopt ${quizAnswers[quizIndex]===i?(i===q.a?'correct':'wrong'):''}" ${quizAnswers[quizIndex]!==undefined?'disabled':''} onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${quizAnswers[quizIndex]!==undefined?`<div class="feedback"><b>${quizAnswers[quizIndex]===q.a?'Chính xác!':'Chưa chính xác.'}</b><br>${q.why}</div>`:''}<div class="btnrow" style="justify-content:space-between;margin-top:20px"><button onclick="quizIndex=Math.max(0,quizIndex-1);render()" ${quizIndex===0?'disabled':''}>← Câu trước</button>${quizIndex<quiz.length-1?`<button class="primary" onclick="quizIndex++;render()">Câu tiếp theo →</button>`:`<button class="primary" onclick="finishQuiz()">Xem kết quả</button>`}</div><div id="quizFinal"></div></div>`}
function answerQuiz(i){quizAnswers[quizIndex]=i;render()}
function finishQuiz(){state.quizScore=quiz.reduce((s,q,i)=>s+(quizAnswers[i]===q.a?1:0),0);save();document.getElementById('quizFinal').innerHTML=`<div class="callout"><h3>Kết quả: ${state.quizScore}/${quiz.length}</h3><p>${state.quizScore>=4?'Tốt lắm! Bạn đã nắm được phần lớn kiến thức nền tảng.':'Hãy xem lại bài học liên quan rồi thử lại để củng cố kiến thức.'}</p><button onclick="quizIndex=0;quizAnswers={};render()">Làm lại quiz</button></div>`;toast('Đã lưu điểm quiz')}
function completeLesson(id){if(!state.completed.includes(id))state.completed.push(id);save();render();toast('Đã lưu tiến độ bài học')}
function openLesson(id){lessonId=id;go('academy')}
const monitorLogs=[
 {time:'07:02:11',level:'INFO',source:'SFIS-API',station:'ST10',message:'Health check passed; response_time_ms=84',id:'REQ-1001'},
 {time:'07:04:28',level:'WARN',source:'SFIS-API',station:'ST20',message:'API response latency above baseline: 1250 ms',id:'REQ-1002'},
 {time:'07:06:03',level:'ERROR',source:'DATABASE',station:'ALL',message:'Connection pool utilization reached 92%',id:'DB-2201'},
 {time:'07:07:19',level:'INFO',source:'SFIS-API',station:'ST10',message:'Production result accepted; SN=SN10008',id:'REQ-1003'},
 {time:'07:09:42',level:'CRITICAL',source:'SFIS-API',station:'ST30',message:'Health endpoint unavailable; HTTP 503',id:'REQ-1004'},
 {time:'07:10:15',level:'WARN',source:'WINDOWS-SERVICE',station:'APP01',message:'Private bytes increased to 1.8 GB',id:'SYS-3001'},
 {time:'07:12:51',level:'ERROR',source:'DATABASE',station:'ALL',message:'Timeout expired while waiting for a connection',id:'DB-2202'},
 {time:'07:15:00',level:'INFO',source:'MONITOR',station:'ALL',message:'Synthetic check completed successfully',id:'MON-001'}
];
function monitoringLab(){return `${head('OBSERVABILITY & OPERATIONS','Monitoring & Alerting Lab','Theo dõi sức khỏe SFIS qua KPI, log, ngưỡng cảnh báo và quy trình phản ứng sự cố. Toàn bộ telemetry bên dưới là dữ liệu mô phỏng.')}<div class="grid stats"><div class="card"><div class="statlabel">API Availability</div><div class="statvalue" id="monAvailability">99.2%</div><div class="statfoot">Synthetic health checks</div></div><div class="card"><div class="statlabel">API P95 Latency</div><div class="statvalue" id="monLatency">1,250 ms</div><div class="statfoot">Mục tiêu tham khảo: dưới 500 ms</div></div><div class="card"><div class="statlabel">Error Rate</div><div class="statvalue" id="monErrorRate">3.8%</div><div class="statfoot">5xx / tổng request mô phỏng</div></div><div class="card"><div class="statlabel">Active Alerts</div><div class="statvalue" id="monActiveAlerts">3</div><div class="statfoot">Cần xác minh và phân công</div></div></div>
<div class="grid two"><section class="card"><h3>Service health overview</h3><p class="sub">Trạng thái các thành phần trong môi trường giả lập</p><div id="monServices"><div class="module"><div class="module-icon">●</div><div><b>SFIS API</b><p>Degraded · HTTP 503 tại ST30</p></div><span class="status">Warning</span></div><div class="module"><div class="module-icon">▤</div><div><b>SQL Server</b><p>Connection pool 92% · timeout xuất hiện</p></div><span class="status">Warning</span></div><div class="module"><div class="module-icon">▣</div><div><b>Windows Service</b><p>Running · memory tăng bất thường</p></div><span class="status">Observe</span></div><div class="module"><div class="module-icon">⌁</div><div><b>Network / DNS</b><p>Resolution và connectivity bình thường</p></div><span class="status done">Healthy</span></div></div></section>
<section class="card"><h3>Metric threshold simulator</h3><p class="sub">Thay đổi ngưỡng để xem trạng thái cảnh báo (không giám sát máy thật).</p><div class="field"><label>API latency threshold (ms)</label><input id="monLatencyThreshold" type="number" min="100" max="10000" value="1000"></div><div class="field"><label>Error rate threshold (%)</label><input id="monErrorThreshold" type="number" min="0.1" max="100" step="0.1" value="2"></div><div class="field"><label>DB connection pool threshold (%)</label><input id="monPoolThreshold" type="number" min="10" max="100" value="85"></div><button class="primary" id="evaluateMonThresholds">Evaluate thresholds</button><div id="monThresholdResult" class="feedback">Nhấn Evaluate để đánh giá ngưỡng với metric mô phỏng.</div></section></div>
<div class="grid two" style="margin-top:16px"><section class="card"><h3>Log Explorer</h3><p class="sub">Lọc theo severity và tìm nội dung / Request ID.</p><div class="field"><label>Severity</label><select id="monLogLevel"><option value="ALL">All levels</option><option>CRITICAL</option><option>ERROR</option><option>WARN</option><option>INFO</option></select></div><div class="field"><label>Search</label><input id="monLogSearch" placeholder="Ví dụ: timeout, ST30, DB-2201"></div><div class="small" id="monLogCount"></div><div id="monLogResults"></div></section>
<section class="card"><h3>Alert response workflow</h3><p class="sub">Thực hành quy trình xử lý cảnh báo từ lúc phát hiện đến khi đóng.</p><div class="field"><label>Chọn alert</label><select id="monAlertScenario"><option value="api">API availability giảm / HTTP 503</option><option value="db">Database connection pool gần đầy</option><option value="latency">API latency tăng cao</option></select></div><div id="monAlertDetail" class="feedback"></div><div class="field"><label>Incident status</label><select id="monIncidentStatus"><option>New</option><option>Acknowledged</option><option>Investigating</option><option>Mitigated</option><option>Resolved</option></select></div><button id="saveMonIncident">Ghi nhận trạng thái</button><div id="monIncidentFeedback" class="small" style="margin-top:9px">Chưa có cập nhật.</div></section></div>
<div class="card" style="margin-top:16px"><h3>Monitoring fundamentals</h3><div class="grid three"><div><b>Metrics</b><p class="sub">Số liệu theo thời gian: latency, throughput, error rate, CPU, memory, disk, DB connections.</p></div><div><b>Logs</b><p class="sub">Sự kiện có timestamp, severity, source, correlation/request ID và message.</p></div><div><b>Traces</b><p class="sub">Theo dấu một request qua API, service và database để xác định điểm nghẽn.</p></div></div><div class="callout"><b>Nguyên tắc vận hành:</b> Alert là tín hiệu cần xác minh, không phải kết luận nguyên nhân. Kiểm tra phạm vi ảnh hưởng, đối chiếu timestamp và correlation ID, thu thập evidence trước khi thay đổi hệ thống.</div></div>`}
function renderMonitorLogs(){let level=document.getElementById('monLogLevel')?.value||'ALL',q=(document.getElementById('monLogSearch')?.value||'').toLowerCase(),rows=monitorLogs.filter(x=>(level==='ALL'||x.level===level)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));let box=document.getElementById('monLogResults');if(!box)return;document.getElementById('monLogCount').textContent=`${rows.length} / ${monitorLogs.length} log entries`;box.innerHTML=rows.length?`<div style="overflow:auto"><table class="resulttable"><thead><tr><th>Time</th><th>Level</th><th>Source / Message</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.time}</td><td><span class="status ${x.level==='INFO'?'done':''}">${x.level}</span></td><td><b>${x.source}</b> · ${x.message}<div class="small">${x.station} · ${x.id}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không tìm thấy log phù hợp.</div>'}
function renderMonitorAlert(){let id=document.getElementById('monAlertScenario')?.value,box=document.getElementById('monAlertDetail');if(!box)return;let d={api:['Triệu chứng','Health check trả HTTP 503 tại ST30; cần xác định một station hay toàn bộ line bị ảnh hưởng.','Xác minh thời điểm bắt đầu và station phạm vi ảnh hưởng','Kiểm tra API service health, dependency và recent deployment','Đối chiếu API log với Request ID và application event','Chỉ thực hiện rollback/restart theo change hoặc incident approval'],db:['Triệu chứng','Connection pool đạt 92%, xuất hiện timeout khi lấy connection.','Kiểm tra active sessions, pool usage và thời gian timeout','Tìm query chậm, blocking và connection không được dispose','Đối chiếu DB CPU, I/O, wait stats và application logs','Không kill session hoặc tăng pool tùy tiện khi chưa rõ nguyên nhân'],latency:['Triệu chứng','P95 latency 1,250 ms vượt ngưỡng mục tiêu 500 ms.','So sánh latency theo endpoint, station và khoảng thời gian','Tách thời gian xử lý API với thời gian chờ database','Kiểm tra network RTT, retry và dependency','Đánh giá impact tới takt time / throughput của line']}[id];box.innerHTML=`<b>${d[0]}</b><p>${d[1]}</p><b>Checklist điều tra</b><ol>${d.slice(2).map(x=>`<li>${x}</li>`).join('')}</ol>`}
function evaluateMonitorThresholds(){let l=Number(document.getElementById('monLatencyThreshold').value),e=Number(document.getElementById('monErrorThreshold').value),p=Number(document.getElementById('monPoolThreshold').value),issues=[];if(!l||l<100||!e||e<=0||e>100||!p||p<10||p>100){toast('Vui lòng nhập ngưỡng hợp lệ');return}if(1250>l)issues.push(`Latency 1,250 ms vượt ngưỡng ${l} ms`);if(3.8>e)issues.push(`Error rate 3.8% vượt ngưỡng ${e}%`);if(92>p)issues.push(`DB pool 92% vượt ngưỡng ${p}%`);document.getElementById('monThresholdResult').innerHTML=issues.length?`<b style="color:var(--red)">${issues.length} threshold breach</b><ul>${issues.map(x=>`<li>${x}</li>`).join('')}</ul><p>Ưu tiên đánh giá impact và tương quan giữa các metric trước khi xử lý.</p>`:'<b style="color:var(--green)">Không có threshold breach</b><p>Các metric mô phỏng đang dưới ngưỡng đã cấu hình.</p>';document.getElementById('monActiveAlerts').textContent=issues.length}
function bindMonitor(){let level=document.getElementById('monLogLevel'),search=document.getElementById('monLogSearch');if(level)level.onchange=renderMonitorLogs;if(search)search.oninput=renderMonitorLogs;if(document.getElementById('monLogResults'))renderMonitorLogs();let sc=document.getElementById('monAlertScenario');if(sc){sc.onchange=renderMonitorAlert;renderMonitorAlert()}let ev=document.getElementById('evaluateMonThresholds');if(ev)ev.onclick=evaluateMonitorThresholds;let save=document.getElementById('saveMonIncident');if(save)save.onclick=()=>{let v=document.getElementById('monIncidentStatus').value;document.getElementById('monIncidentFeedback').textContent=`Đã ghi nhận trạng thái mô phỏng: ${v}. Hãy cập nhật owner, timestamp, evidence và next action trong incident record.`;toast('Đã cập nhật incident mô phỏng')}}
function bindDynamic(){if(page==='interview')bindInterview();if(page==='monitor')bindMonitor();if(page==='automation')bindAutomation();renderVocab();let vg=document.getElementById('vocabGroup');if(vg)vg.onchange=renderVocab;nextCommPhrase();
 let sk=document.getElementById('saveClaudeKey');if(sk)sk.onclick=saveClaudeKey;let tk=document.getElementById('testClaudeKey');if(tk)tk.onclick=()=>{if(saveClaudeKey()){let a=document.getElementById('aiTask'),b=document.getElementById('aiContext');if(a&&b){a.value='explain';b.value='Trả lời ngắn gọn: kết nối Claude API đang hoạt động.'}callClaude()}};let ck=document.getElementById('clearClaudeKey');if(ck)ck.onclick=clearClaudeKey;let ask=document.getElementById('askClaude');if(ask)ask.onclick=callClaude;let clear=document.getElementById('clearAiChat');if(clear)clear.onclick=()=>{let x=document.getElementById('aiContext');if(x)x.value='';setAiAnswer('')};
 let r=document.getElementById('runSql');if(r)r.onclick=runSql;
 let refreshProd=document.getElementById('refreshProduction');if(refreshProd)refreshProd.onclick=()=>{productionFilters={station:document.getElementById('prodStation').value,workorder:document.getElementById('prodWO').value,model:document.getElementById('prodModel').value,metric:document.getElementById('prodMetric').value};loadProductionData()};
 let resetProd=document.getElementById('resetProduction');if(resetProd)resetProd.onclick=()=>{productionFilters={station:'ALL',workorder:'ALL',model:'ALL',metric:'station'};render()};
 let exportProd=document.getElementById('exportProduction');if(exportProd)exportProd.onclick=exportProductionCSV;
 if(page==='production')loadProductionData();if(document.getElementById('sqlEngineStatus')){initSqlEngine().then(()=>{let s=document.getElementById('sqlEngineStatus');if(s)s.textContent='SQLite sẵn sàng';let st=document.getElementById('sqlStatus');if(st)st.textContent='Sẵn sàng chạy query'}).catch(e=>{let s=document.getElementById('sqlEngineStatus');if(s)s.textContent='Chưa tải được';showSqlError(e.message)})}
 let mock=document.getElementById('sendMockApi');if(mock)mock.onclick=runMockApi;let fmt=document.getElementById('formatApiJson');if(fmt)fmt.onclick=()=>{try{document.getElementById('apiBody').value=JSON.stringify(JSON.parse(document.getElementById('apiBody').value),null,2);toast('JSON đã được format')}catch(e){toast('JSON không hợp lệ: '+e.message)}};let val=document.getElementById('validateJson');if(val)val.onclick=validateLabJson;let bad=document.getElementById('sampleBadJson');if(bad)bad.onclick=()=>{document.getElementById('jsonInput').value='{ "serialNumber": "SN10001", "result": PASS }';validateLabJson()};let ns=document.getElementById('networkScenario');if(ns){ns.onchange=renderNetworkScenario;renderNetworkScenario()}
 let sc=document.getElementById('sysCommand');if(sc){sc.onchange=renderSysCommand;renderSysCommand()}
 let ss=document.getElementById('sysService');if(ss){ss.onchange=renderSysService;renderSysService()}
 let sx=document.getElementById('sysCase');if(sx){sx.onchange=renderSysCase;renderSysCase()}
 let dt=document.getElementById('dbaTopic');if(dt){dt.onchange=renderDbaTopic;renderDbaTopic()}let bt=document.getElementById('backupType');if(bt){bt.onchange=renderBackupDetail;renderBackupDetail()}let br=document.getElementById('buildRecovery');if(br)br.onclick=buildRecoveryPlan;let iq=document.getElementById('indexQuery');if(iq){iq.onchange=renderIndexDetail;renderIndexDetail()}let il=document.getElementById('isolationLevel');if(il){il.onchange=renderIsolationDetail;renderIsolationDetail()}let ds=document.getElementById('dbaScenario');if(ds){ds.onchange=renderDbaScenario;renderDbaScenario()}
 let s=document.getElementById('academySearch');if(s){s.oninput=()=>{academySearch=s.value;academyPage=0;let pos=s.selectionStart;render();let next=document.getElementById('academySearch');next.focus();next.setSelectionRange(pos,pos)}}
 let f=document.getElementById('academyFilter');if(f)f.onchange=()=>{academyFilter=f.value;academyPage=0;render()}
}
render();
</script>
